services:
  nas-notes:
    build: .
    image: nas-notes:local
    container_name: nas-notes
    restart: unless-stopped
    ports:
      # 只绑回环：外部一律走下方 proxy 的 HTTPS（28443）。
      # 8080 在 NAS 上被 reader 占用，故仍映射一个宿主端口，但仅限本机调试。
      - "127.0.0.1:28080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      # 账户引导（可选）：不设则默认账户 admin / admin。
      # 仅首次初始化数据库时生效，之后请在网页「设置」里修改。
      # NOTES_USER: "myname"
      # NOTES_PASS: "初始口令"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # HTTPS 反向代理：https://<NAS 地址>:28443（自签 CA，证书见 deploy/caddy/certs/）
  # 与 nas-notes 同一 compose 网络，可直接按服务名反代。
  proxy:
    image: caddy:2-alpine
    container_name: nas-notes-proxy
    restart: unless-stopped
    depends_on:
      - nas-notes
    ports:
      - "28443:28443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/certs:/certs:ro
