services:
  nas-notes:
    build: .
    image: nas-notes:local
    container_name: nas-notes
    restart: unless-stopped
    ports:
      # 宿主 28080 → 容器 8080（NAS 上 8080 已被 reader 容器占用）
      # 仅给反向代理使用；手机端 PWA 离线需要 HTTPS，请配合反代域名访问
      - "28080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: "/data"
      # 账户引导（可选）：不设则默认账户 admin / admin。
      # 仅首次初始化数据库时生效，之后请在网页「设置」里修改。
      # NOTES_USER: "myname"
      # NOTES_PASS: "初始口令"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
